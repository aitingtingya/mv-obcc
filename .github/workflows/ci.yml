name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Verify native Windows registry integration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path 'tests/windows-registry.integration.test.ts') {
            npm test -- tests/windows-registry.integration.test.ts
          } else {
            Write-Host 'tests/ not shipped in this checkout; skipping registry integration test'
          }
        env:
          MV_AIDE_WINDOWS_REGISTRY_INTEGRATION: '1'

  package:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Create release zip
        run: |
          mkdir -p release/mv-obcc
          cp dist/main.js manifest.json styles.css release/mv-obcc/
          cd release && zip -r mv-obcc.zip mv-obcc
      - uses: actions/upload-artifact@v4
        with:
          name: mv-obcc-ide
          path: release/
